<script>
/* ═══ BUBBLE POP · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Aim, shoot, match 3 bubbles to pop them. Bubbles you cut loose fall, and every few that
 * fall push an extra row onto a rival. A bubble past the line is out. Versus, 2–4 players;
 * bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ board size, shot speed, how often rows push in, rows sent, bots
 *   BUBBLES ....... the bubble colors and the little mark inside each
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   BOARD ......... one board's rules: the hex grid, flying, sticking, popping, dropping, new rows
 *   MATCH (HOST) .. countdown, who is out, the winner, the restart, sending rows
 *   BOTS (HOST) ... a bot tries many angles and shoots one of the best
 *   ME ............ my board: ticking, aiming, shooting, publishing
 *   RIVALS ........ other players' boards rebuilt from their snapshots: flying shots, falls
 *   DRAW .......... bubble pictures, boards (mine large, rivals small), the aim guide, effects
 *   SCREENS ....... sound, hint, results, leaderboard, colors
 *   INPUT ......... mouse / finger aim, keyboard
 *   MAIN LOOP ..... heartbeat, host tick, my tick, draw
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player's board is its OWN entity field `b` = {m, g, k, a, s, j, q, c, x, aim, sh,
 *     p, n, t}: match id, the 96 cells as one string ("." empty, a–f a color), rows pushed
 *     so far, alive, score, rows sent, rows waiting, current and next bubble, aim (degrees),
 *     the shot in flight [shot number, angle, color], timer rows taken, bubbles drawn,
 *     shots fired. Also `n` (name), `c` (color) and `hb` (heartbeat).
 *   - The HOST (lowest live sessionId) runs the match in ONE shared field, `match`: {id, v,
 *     ph, seed, startAt, players, bots, out, winner, endsAt, ready}. It reads every board,
 *     marks who is out and calls the winner. Bots' boards live in the shared field `bots`.
 *   - Dropping 3+ bubbles sends rows with a "junk" event {to, n, m, f}. The victim pushes
 *     them onto its OWN board a moment later; rows you send first cancel them.
 *   - Everyone starts from the same board, and the timed rows come from match.seed and
 *     match.startAt (timestamps, so a new host carries on at the same pace).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "best-score": each player's best match.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // bots fill the match up to this many boards (2–4)
  cols: 8, rows: 12,    // board size in bubbles (every other row holds one fewer)
  lineRow: 11,          // a bubble in this row is past the line: that board is out
  kinds: 5,             // bubble colors in play (3–6; more is harder)
  startRows: 5,         // rows of bubbles at the start
  shotSpeed: 22,        // a shot flies this many bubble widths per second
  pushMs: 12000,        // a new row pushes in from the top this often at the start…
  pushSpeedUp: 0.92,    // …each one a little sooner…
  minPushMs: 4000,      // …down to this
  dropsForRow: 3,       // dropping 3+ bubbles pushes one extra row onto a rival…
  dropsPerExtra: 6,     // …and every 6 more, another…
  bigPop: 7,            // …and popping this many at once, another
  maxSend: 3,           // at most this many rows in one go
  maxWaiting: 4,        // at most this many rows waiting over one board (the rest are lost)
  junkDelayMs: 2500,    // sent rows wait this long above a board before they push in
  points: 10,           // per popped bubble (dropped ones score double)
  clearBonus: 500,      // for emptying your whole board
  countdownMs: 3000,    // 3, 2, 1, go
  overMs: 9000,         // the results screen
  botThinkMs: 1300,     // a bot shoots about this often (lower is faster)
  botTurn: 3.2,         // how fast a bot swings its launcher (radians per second)
  botAimNoise: 0.05,    // how far off a bot's aim can be (radians)

const BOT_NAMES = ["Bubbles", "Fizz", "Popper", "Blub", "Suds", "Foam Bot", "Pearl", "Splash"];

// ── BUBBLES ─────────────────────────────────────────────────────────────────────────
// Each bubble color is a letter on the wire. The faint mark inside keeps colors apart for everyone.
const BUBBLES = {
  a: { color: "#ff5d73", dark: "#a3173a", mark: "circle" },
  b: { color: "#ffd23f", dark: "#a8730a", mark: "square" },
  c: { color: "#4ade80", dark: "#137a3e", mark: "triangle" },
  d: { color: "#3fb8ff", dark: "#145f9e", mark: "diamond" },
  e: { color: "#b98cff", dark: "#5428a8", mark: "star" },
  f: { color: "#ff9f43", dark: "#a8520a", mark: "cross" },

const bubbleKinds = () => Object.keys(BUBBLES).slice(0, Math.max(3, Math.min(6, CONFIG.kinds)));

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',

  endpoint: 'wss://live.multiplayeragent.com',

const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {

  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),

}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);

}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field (shared or a player's), parsed once per change. Read-only. */

let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];

    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── BOARD ───────────────────────────────────────────────────────────────────────────
// Distances are in bubble widths. grid[row][col], row 0 at the top. Every other row sits half
// a bubble to the right and holds one fewer; which ones depends on k, the rows pushed so far.
const ROW_H = Math.sqrt(3) / 2;
const LX = CONFIG.cols / 2, LY = 0.5 + (CONFIG.rows - 1) * ROW_H + 1.25, FIELD_H = LY + 0.85; // launcher, board height
const MIN_AIM = (12 * Math.PI) / 180, MAX_AIM = Math.PI - MIN_AIM;

const isOffset = (B, r) => (r + B.k) % 2 === 1;

const cellY = (r) => 0.5 + r * ROW_H;
function neighbors(B, r, c) {
  const o = isOffset(B, r) ? 1 : 0;
  return [[r, c - 1], [r, c + 1], [r - 1, c - 1 + o], [r - 1, c + o], [r + 1, c - 1 + o], [r + 1, c + o]].filter(([y, x]) => y >= 0 && y < CONFIG.rows && x >= 0 && x < rowLen(B, y));
}
/** One new row of bubbles from the match seed: colors come in little runs, so there is something to pop. */
function makeRow(seed, idx, len) {
  const rnd = mulberry32((seed ^ Math.imul(idx + 7, 0x9e3779b1)) >>> 0), kinds = bubbleKinds(), row = Array(CONFIG.cols).fill(".");
  for (let c = 0; c < len; c++) row[c] = c > 0 && rnd() < 0.45 ? row[c - 1] : kinds[Math.floor(rnd() * kinds.length)];
  return row;
}
function newBoard(seed) {
  const B = { seed, grid: [], k: 0, alive: true, score: 0, sent: 0, pending: [], cur: "", next: "", drawn: 0, shots: 0, pushes: 0, aim: Math.PI / 2, shot: null, slide: 0, last: "" };
  for (let r = 0; r < CONFIG.rows; r++) B.grid.push(r < CONFIG.startRows ? makeRow(seed, 1000 + r, rowLen(B, r)) : Array(CONFIG.cols).fill("."));
  B.cur = drawColor(B); B.next = drawColor(B);

}
const colorsOn = (B) => [...new Set(B.grid.flat().filter((ch) => ch !== "."))].sort();
/** The next bubble for the launcher: seeded, and always a color still on the board. */
function drawColor(B) {
  const on = colorsOn(B), pool = on.length ? on : bubbleKinds();

}
/** Every bubble connected to (r, c) whose letter passes `ok`, as [row, col] pairs. */
function flood(B, r, c, ok, seen = new Set()) {
  const out = [], todo = [[r, c]];

    const [y, x] = todo.pop(), key = y * 16 + x;
    if (seen.has(key) || !ok(B.grid[y][x])) continue;

    for (const n of neighbors(B, y, x)) todo.push(n);

}
/** Is any bubble within touching distance of (x, y)? Only rows near y are checked. */
function hits(B, x, y) {
  const r0 = Math.round((y - 0.5) / ROW_H);
  for (let r = Math.max(0, r0 - 1); r <= Math.min(CONFIG.rows - 1, r0 + 1); r++) for (let c = 0; c < rowLen(B, r); c++) {
    if (B.grid[r][c] !== "." && (cellX(B, r, c) - x) ** 2 + (cellY(r) - y) ** 2 < 0.8 * 0.8) return true;

}
/** The empty cell nearest to (x, y) that touches a bubble or the ceiling. */
function snapCell(B, x, y) {

  for (const strict of [true, false]) {
    for (let r = Math.max(0, r0 - 1); r <= Math.min(CONFIG.rows - 1, r0 + 1); r++) for (let c = 0; c < rowLen(B, r); c++) {

}
/** Move a shot along; bounce off the side walls. Returns the cell it sticks in, or null while it flies. */
function flyShot(B, s, dist) {

    if (s.x < 0.5) { s.x = 1 - s.x; s.dx = -s.dx; if (s.path) s.path.push([0.5, s.y]); }
    if (s.x > CONFIG.cols - 0.5) { s.x = 2 * CONFIG.cols - 1 - s.x; s.dx = -s.dx; if (s.path) s.path.push([CONFIG.cols - 0.5, s.y]); }

}
const newShot = (angle, color) => ({ x: LX, y: LY, dx: Math.cos(angle), dy: -Math.sin(angle), color, angle });
/** Where a shot at this angle would stick (and, for the aim guide, the path it takes). */
function trace(B, angle, withPath) {
  const s = newShot(angle, "");
  if (withPath) s.path = [[LX, LY]];
  const end = flyShot(B, s, 40);
  if (s.path) s.path.push([s.x, s.y]);
  return end && end.r >= 0 ? { ...end, path: s.path } : null;
}
function shoot(B) {
  if (B.shot || !B.alive) return false;
  B.shot = { ...newShot(B.aim, B.cur), n: ++B.shots };
  B.cur = B.next; B.next = drawColor(B);
  return true;
}
function swapBubbles(B) { if (B.alive) [B.cur, B.next] = [B.next, B.cur]; }
const pastLine = (B) => B.grid.slice(CONFIG.lineRow).some((row) => row.some((ch) => ch !== "."));
/** A bubble sticks: pop its group if 3+, then drop whatever no longer hangs from the ceiling. */
function land(B, r, c, color) {
  const popped = [], dropped = [];

  const group = flood(B, r, c, (ch) => ch === color);

    for (const [y, x] of group) { popped.push([cellX(B, y, x), cellY(y), color]); B.grid[y][x] = "."; }
    const held = new Set();
    for (let x = 0; x < rowLen(B, 0); x++) flood(B, 0, x, (ch) => ch !== ".", held);
    for (let y = 0; y < CONFIG.rows; y++) for (let x = 0; x < rowLen(B, y); x++) if (B.grid[y][x] !== "." && !held.has(y * 16 + x)) { dropped.push([cellX(B, y, x), cellY(y), B.grid[y][x]]); B.grid[y][x] = "."; }

/** A new row pushes in from the top: everything moves down one. */
function pushRow(B) {

}
/** How many timed rows are due by now: the gaps shrink each time, measured from match.startAt. */
function pushesDue(m, nowMs) {

}

const waiting = (B) => B.pending.reduce((a, p) => a + p.n, 0);
const deg = (a) => Math.round((a * 1800) / Math.PI) / 10;
/** A board as it goes on the wire: one short JSON string. */
const packBoard = (B, m) => JSON.stringify({ m, g: B.grid.map((row) => row.join("")).join(""), k: B.k, a: B.alive ? 1 : 0, s: B.score, j: B.sent, q: waiting(B), c: B.cur, x: B.next, aim: deg(B.aim), sh: B.shot ? [B.shot.n, Math.round(B.shot.angle * 1e4) / 1e4, B.shot.color] : 0, p: B.pushes, n: B.drawn, t: B.shots });

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, was: false, bots: new Map(), botsRaw: "", lastBots: 0 };
function match() {
  const m = cached("match", S.shared.match, null);

}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const nameOf = (m, id) => (id === net.sessionId ? myName : m?.bots.find((b) => b.i === id)?.n) || String(S.entities.players?.[id]?.n ?? "Player").slice(0, 12);
const colorOf = (m, id) => (id === net.sessionId ? myColor : m?.bots.find((b) => b.i === id)?.c) || S.entities.players?.[id]?.c || "#aaa";

const newBot = (B) => ({ B, plan: null, nextAt: 0, mistake: CONFIG.botMistake });

function newMatch(id) {

  ctx.fillText(`${V ? V.score : 0} pts${sp.big ? ` · ${V ? V.sent : 0} rows sent` : ""}`, x + w / 2, y + h + pad + (sp.big ? 18 : 12));
  if (view.out || (V && !V.alive)) {
    ctx.fillStyle = "#071a2cbb"; ctx.fillRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
    ctx.fillStyle = "#ff5a6e"; ctx.font = `900 ${Math.max(16, u * 1.6)}px system-ui, sans-serif`; ctx.fillText("KO", x + w / 2, y + h / 2);
  }
}
function drawLauncher(V, x, y, u, mine) {
  const lx = x + LX * u, ly = y + LY * u;
  ctx.fillStyle = "#ffffff14"; ctx.beginPath(); ctx.arc(lx, ly + u * 0.45, u * 1.1, Math.PI, 0); ctx.fill();
  ctx.save(); ctx.translate(lx, ly); ctx.rotate(-V.aim);
  ctx.fillStyle = "#cfe8fb"; ctx.beginPath(); ctx.moveTo(u * 1.55, 0); ctx.lineTo(u * 1.05, -u * 0.22); ctx.lineTo(u * 1.05, u * 0.22); ctx.closePath(); ctx.fill();
  ctx.fillRect(u * 0.45, -u * 0.07, u * 0.65, u * 0.14);
  ctx.restore();
  if (V.alive && V.cur) bubble(V.cur, lx, ly, u * 0.98);
  if (V.alive && V.next) {
    bubble(V.next, lx + u * 2.2, ly + u * 0.2, u * 0.7);
    if (mine && u > 20) { ctx.fillStyle = "#cfe8fb99"; ctx.font = "600 10px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("NEXT", lx + u * 2.2, ly + u * 0.85); }
  }
}
/** My aim guide: dots along the path (off the walls) and a ring where the bubble will stick. */
function drawGuide(V, x, y, u) {
  const end = trace(V, V.aim, true);
  if (!end) return;
  ctx.fillStyle = "#ffffffb0";
  let left = 0;
  for (let i = 1; i < end.path.length; i++) {
    const [ax, ay] = end.path[i - 1], [bx, by] = end.path[i], len = Math.hypot(bx - ax, by - ay);
    for (let d = left; d < len; d += 0.45) { ctx.beginPath(); ctx.arc(x + (ax + ((bx - ax) * d) / len) * u, y + (ay + ((by - ay) * d) / len) * u, Math.max(1.5, u * 0.06), 0, Math.PI * 2); ctx.fill(); left = d + 0.45 - len; }
  }
  ctx.strokeStyle = BUBBLES[V.cur]?.color || "#fff"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.arc(x + cellX(V, end.r, end.c) * u, y + cellY(end.r) * u, u * 0.45, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
}
function drawBackground(now) {
  const grd = ctx.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "#0b2a4a"); grd.addColorStop(1, "#04111f");
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#8fd3ff22"; ctx.lineWidth = 1.5;
  for (let i = 0; i < 26; i++) { // slow bubbles drifting up behind everything
    const r = 3 + (i % 5) * 2.5, x = ((i * 0.6180339) % 1) * W + Math.sin(now / 1400 + i) * 12, y = H + 20 - ((((i * 0.37) % 1) * (H + 40) + now * (0.012 + (i % 4) * 0.004)) % (H + 40));
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  }
}
function draw(m, now, dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(now);
  if (!m) return;
  const views = boardViews(m, now), spots = layout(views);
  fx.spots = spots;
  for (const d of fx.drops) { d.vy += 22 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
  for (const view of views) {
    if (view.V && view.V.aimTo !== undefined) animateRival(view.V, dt);
    drawBoard(view, spots.get(view.id), now, m);
  }
  for (const p of fx.pops) { // popped bubbles burst
    const sp = spots.get(p.id);
    if (!sp) continue;
    if (!p.done) { p.done = true; for (let i = 0; i < (sp.big ? 8 : 3); i++) { const a = Math.random() * Math.PI * 2, v = (sp.big ? 140 : 60) * (0.5 + Math.random()); fx.parts.push({ x: sp.x + p.x * sp.u, y: sp.y + p.y * sp.u, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 1, c: BUBBLES[p.ch]?.color || "#fff", s: sp.big ? 4 : 2 }); } }
    const k = (now - p.at) / 260;
    if (k < 1) { ctx.strokeStyle = BUBBLES[p.ch]?.color || "#fff"; ctx.globalAlpha = 1 - k; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sp.x + p.x * sp.u, sp.y + p.y * sp.u, sp.u * (0.45 + k * 0.5), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  for (const a of fx.attacks) { // rows flying from one board to another
    const k = (now - a.at) / 560, from = spots.get(a.from), to = spots.get(a.to);
    if (k > 1 || !from || !to) continue;
    const fxp = from.x + (from.u * CONFIG.cols) / 2, fyp = from.y + from.u * 4, tx = to.x + (to.u * CONFIG.cols) / 2, ty = to.y;
    const px = fxp + (tx - fxp) * k, py = fyp + (ty - fyp) * k - Math.sin(k * Math.PI) * 90;
    for (let i = 0; i < Math.min(5, a.n * 2); i++) bubble("abcde"[i % 5], px - 18 + i * 9, py + Math.sin(i + now / 80) * 3, 14);
    if (k > 0.92 && !a.hit) { a.hit = true; for (let i = 0; i < 10; i++) fx.parts.push({ x: tx, y: ty, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 250, life: 1, c: "#8fd3ff", s: 4 }); }
  }
  for (let i = fx.parts.length - 1; i >= 0; i--) {
    const p = fx.parts[i]; p.life -= dt * 1.8; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) { fx.parts.splice(i, 1); continue; }
    ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const t of fx.texts) { // "4 dropped!" over the board that did it
    const sp = spots.get(t.id), k = (now - t.at) / 1000;
    if (!sp || k > 1) continue;
    const size = Math.max(14, sp.u * (sp.big ? 0.8 : 0.9)) * (k < 0.15 ? 0.6 + k * 2.7 : 1);
    ctx.globalAlpha = 1 - k * k; ctx.font = `900 ${size}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.strokeStyle = "#04111f";
    const tx = sp.x + (sp.u * CONFIG.cols) / 2, ty = sp.y + sp.u * FIELD_H * 0.55 - k * 40;
    ctx.strokeText(t.text, tx, ty); ctx.fillStyle = t.color; ctx.fillText(t.text, tx, ty);
  }
  ctx.globalAlpha = 1;
  fx.pops = fx.pops.filter((p) => now - p.at < 300); fx.drops = fx.drops.filter((d) => now - d.at < 900);
  fx.attacks = fx.attacks.filter((a) => now - a.at < 600); fx.texts = fx.texts.filter((t) => now - t.at < 1000); fx.shake *= 0.86;
  const t = Date.now();
  if (m.ph === "count") { const n = Math.ceil((m.startAt - t) / 1000); big(n > 0 ? String(n) : "GO!", "#ffd23f"); }
  else if (m.ph === "play" && t - m.startAt < 700) big("GO!", "#80ed99");
  else if (m.ph === "play" && !m.players.includes(net.sessionId) && !ATTRACT) big("Watching", "#cfe8fb", "You'll play in the next match", 36, SAFE_TOP + 60);
}
function big(text, color, sub, size = Math.min(96, W * 0.16), y = H * 0.45) {
  ctx.textAlign = "center"; ctx.font = `900 ${size}px system-ui, sans-serif`;
  ctx.lineWidth = 8; ctx.strokeStyle = "#04111f"; ctx.strokeText(text, W / 2, y); ctx.fillStyle = color; ctx.fillText(text, W / 2, y);
  if (sub) { ctx.font = "700 15px system-ui, sans-serif"; ctx.lineWidth = 4; ctx.strokeText(sub, W / 2, y + 26); ctx.fillStyle = "#fff"; ctx.fillText(sub, W / 2, y + 26); }
}

// ── SCREENS ─────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let AC = null;
function unlockAudio() { if (!AC && !ATTRACT) try { AC = new AudioContext(); } catch {} }
function tone(f, ms, type = "sine", vol = 0.05) {
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + ms / 1000);
}
let overFor = -1, board = null;
function hud(m) {
  const n = humans().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the match" : ""}`;
  if (!m) return;
  const early = m.ph === "count" || (m.ph === "play" && Date.now() - m.startAt < 14000 && m.id <= 2);
  $("hint").textContent = ATTRACT || !early ? "" : touchUI ? "Drag to aim, let go to shoot · tap NEXT to swap · match 3 to pop · drop bubbles to send rows" : "Aim with the mouse, click to shoot (or ← → and Space) · right-click or Shift swaps · drop bubbles to send rows";
  $("over").hidden = m.ph !== "over" || ATTRACT;
  if (m.ph !== "over") return;
  const views = boardViews(m, performance.now()), scoreIn = (id) => views.find((x) => x.id === id)?.V?.score || 0;
  const rank = (id) => (id === m.winner ? 1e9 : m.out.includes(id) ? m.out.indexOf(id) - 1e6 : scoreIn(id)); // winner, then boards still in, then the last ones out
  const place = [...m.players].sort((a, b) => rank(b) - rank(a));
  $("oTitle").textContent = !m.winner ? "Draw!" : m.winner === net.sessionId ? "You win!" : `${nameOf(m, m.winner)} wins!`;
  const html = place.map((id) => `<li class="${id === net.sessionId ? "me" : ""}">${esc(nameOf(m, id))}<span>${scoreIn(id)} pts</span></li>`).join("");
  if ($("places").innerHTML !== html) $("places").innerHTML = html;
  $("oNext").textContent = `Next match in ${Math.max(0, Math.ceil((m.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = m.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (overFor === m.id) return;
  overFor = m.id;
  const list = $("board"), score = me.B && me.m === m.id ? me.B.score : 0;
  if (m.winner === net.sessionId) tone(660, 400, "triangle", 0.07);
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (score > 0 ? board.submit(score).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No scores yet. Pop some bubbles!</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").addEventListener("click", () => { if (isHost()) onReady(net.sessionId); else net.send("ready", { r: 1 }); });

/** Two players picked one color (they joined at once), or a bot has mine: the later sessionId picks another. */
function fixColor() {
  const ps = S.entities.players || {}, m = match(), botColors = (m?.bots || []).map((b) => b.c);
  if (!Object.entries(ps).some(([id, p]) => id < net.sessionId && p.c === myColor) && !botColors.includes(myColor)) return;
  const taken = new Set([...Object.entries(ps).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor;
  net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches;
const keys = { left: false, right: false };
/** Aim at a screen point, measured from where my launcher is drawn this frame. */
function aimAt(px, py) {
  const sp = fx.spots.get(net.sessionId);
  if (!sp || !canPlay()) return;
  const lx = sp.x + LX * sp.u, ly = sp.y + LY * sp.u;
  me.B.aim = py < ly - 4 ? Math.max(MIN_AIM, Math.min(MAX_AIM, Math.atan2(ly - py, px - lx))) : px < lx ? MAX_AIM : MIN_AIM;
}
/** Is this screen point on my NEXT bubble (tap it to swap)? */
function onNext(px, py) { const sp = fx.spots.get(net.sessionId); return !!sp && Math.hypot(px - (sp.x + (LX + 2.2) * sp.u), py - (sp.y + (LY + 0.2) * sp.u)) < Math.max(26, sp.u * 0.8); }
const ptr = { id: -1, aiming: false };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (!canPlay()) return;
  if (e.button === 2 || onNext(e.clientX, e.clientY)) { mySwap(); return; }
  ptr.id = e.pointerId; ptr.aiming = true; cv.setPointerCapture(e.pointerId);
  aimAt(e.clientX, e.clientY);
});
cv.addEventListener("pointermove", (e) => { if ((ptr.aiming && e.pointerId === ptr.id) || e.pointerType === "mouse") aimAt(e.clientX, e.clientY); });
cv.addEventListener("pointerup", (e) => {
  if (e.pointerId !== ptr.id || !ptr.aiming) return;
  ptr.aiming = false; ptr.id = -1;
  const sp = fx.spots.get(net.sessionId);
  if (sp && e.clientY < sp.y + (LY - 0.3) * sp.u) myShoot(); // let go below the launcher to cancel
});
cv.addEventListener("pointercancel", () => { ptr.aiming = false; ptr.id = -1; });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });
const KEYMAP = { ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right", ArrowUp: "shoot", w: "shoot", " ": "shoot", Enter: "shoot", ArrowDown: "swap", s: "swap", Shift: "swap", x: "swap" };
addEventListener("keydown", (e) => {
  const k = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!k) return;
  e.preventDefault(); unlockAudio();
  if (k === "left" || k === "right") keys[k] = true;
  else if (!e.repeat) k === "shoot" ? myShoot() : mySwap();
});
addEventListener("keyup", (e) => { const k = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k === "left" || k === "right") keys[k] = false; });
addEventListener("blur", () => { keys.left = keys.right = false; });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let lastHb = 0, lastHud = 0, last = 0;
function frame() {
  const t = performance.now(), dt = Math.max(0, Math.min(0.05, (t - (last || t)) / 1000));
  last = t;
  if (t - lastHb > 1000) { lastHb = t; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(Date.now(), t, dt); else host.was = false;
  const m = match();
  if (m) myTick(m, t, dt);
  draw(m, t, dt);
  if (t - lastHud > 150) { lastHud = t; hud(m); }
  requestAnimationFrame(frame);
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { countdownMs: 200, startRows: 7, pushMs: 3000, minPushMs: 1800, botThinkMs: 380, botTurn: 6, botMistake: 0.25, dropsForRow: 2, junkDelayMs: 600, overMs: 3000 });
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { lastHud = 0; });
  net.on("junk", (msg, from) => { const m = match(); if (msg && m && msg.m === m.id) { fx.attacks.push({ from: msg.f || from, to: msg.to, n: msg.n, at: performance.now() }); receiveRows(m, msg.to, Math.max(0, Math.min(CONFIG.maxSend + 2, msg.n | 0))); } });
  net.on("ready", (msg, from) => { if (isHost()) onReady(from); });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { // the preview: four bots on full boards, so pops and drops start at once
    writeMatch(newMatch(1)); host.was = true;
    host.bots.get("bot1").mistake = 0.1; // the big board in the preview plays a little better
  }
  requestAnimationFrame(frame);
})();
</script>
